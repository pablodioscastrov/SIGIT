services:
  # ---------------------------------------------------------------------------
  # Data Lake SIGIT — Azurite (emulador local de Azure Blob Storage Gen2)
  # ---------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: sigit_datalake
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --debug /data/debug.log
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/status > /dev/null 2>&1 && exit 0"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inventario}
      POSTGRES_USER: ${DB_USER:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventario} -d ${DB_NAME:-inventario}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inventario-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventario}
      DB_USER: ${DB_USER:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:-inventario}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-please-override-with-JWT_SECRET-env-var-2026}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # Origen desde el que el navegador sirve el frontend: sin declararlo, la
      # politica CORS del backend bloquea toda peticion desde la interfaz.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      DATALAKE_ENABLED: ${DATALAKE_ENABLED:-true}
      DATALAKE_CONNECTION_STRING: ${DATALAKE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tiqp;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      DATALAKE_CONTAINER: ${DATALAKE_CONTAINER:-datalake-sigit}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inventario-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 explícito: "localhost" puede resolver a ::1 (IPv6) según la
      # imagen, y nginx aquí solo escucha en IPv4 salvo el "listen [::]:80"
      # de nginx.conf; se deja el IP explícito además como defensa adicional.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventario-net

  # ---------------------------------------------------------------------------
  # Data Lake Sync — corre sync.py automaticamente cada 5 segundos
  # Lee blobs de Azurite via SDK y genera landing__*.json en volumen compartido
  # ---------------------------------------------------------------------------
  datalake-sync:
    build:
      context: ./datalake-demo
    container_name: sigit_datalake_sync
    restart: unless-stopped
    volumes:
      - datalake_landing:/data
    environment:
      - PYTHONUNBUFFERED=1
      - SYNC_OUTPUT_DIR=/data
      - DATALAKE_CONTAINER=${DATALAKE_CONTAINER:-datalake-sigit}
      - DATALAKE_CONNECTION_STRING=${DATALAKE_CONNECTION_STRING}
    depends_on:
      azurite:
        condition: service_healthy
    networks:
      - inventario-net

  # ---------------------------------------------------------------------------
  # File Browser — UI web para explorar los archivos del Data Lake
  # Acceso: http://localhost:8085  (usuario: admin / contraseña: admin)
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:v2-s6
    container_name: sigit_filebrowser
    restart: unless-stopped
    user: "0:0"
    volumes:
      - datalake_landing:/srv/datalake:ro
      - ./datalake-demo/filebrowser-db:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv/datalake
      - FB_PORT=8080
    ports:
      - "${FILEBROWSER_PORT:-8085}:8080"
    networks:
      - inventario-net

networks:
  inventario-net:
    driver: bridge

volumes:
  postgres_data:
  azurite_data:
  datalake_landing:
